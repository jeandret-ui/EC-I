<title>CGI Project Hub — Molepolole</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=STIX+Two+Text:ital@0;1&display=swap" rel="stylesheet">

<body>
<div class="app">
  <header class="top">
    <div class="brand" id="brandHome" role="button" tabindex="0" title="Home"><b>CGI Project Hub</b><span id="brandProject">Molepolole Telemetry Project</span></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="projectctx" id="projectHeader">
      <label class="psel"><span>Project</span><select id="projectSel" aria-label="Project"></select></label>
      <div class="ctxstat"><b id="ctxMain">—</b><span id="ctxLabel">Project</span></div>
      <span id="syncChip" class="chip">Local mode</span>
    </div>
    <div class="rfctx" id="rfHeader">
      <label class="dsel"><span>Design</span><select id="archSel" aria-label="Design"></select></label>
      <span id="specChip" class="chip" title="Compared with the TTA/Rev 3 specification"></span>
      <div class="verdict">
        <div class="big" id="vNum"></div>
        <div><div class="lab" id="vLab"></div><div class="meter" style="margin-top:6px"><i id="vBar"></i><u id="vReq"></u></div></div>
        <span id="vChip" class="chip"></span>
      </div>
    </div>
  </header>
  <div class="body closed" id="body">
    <aside class="side" id="side" aria-label="Inputs"></aside>
    <main class="main">
      <div class="subbar" id="subbar"><nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav><button class="btn sm" id="drawerBtn" aria-controls="side">Supplier inputs</button></div>
      <div class="hops" id="hops" aria-label="Hops"></div>
      <div class="sum" id="techSum" aria-live="polite"></div>
      <div class="view" id="view"></div>
    </main>
  </div>
</div>
